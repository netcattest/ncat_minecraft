plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.gradle' version '[6.0.18,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}
apply plugin: 'org.spongepowered.mixin'
jarJar.enable()

version = mod_version
group = maven_group
archivesBaseName = archives_base_name

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.main.resources.srcDirs += 'src/generated/resources'
mixin.add sourceSets.main, "ncat_minecraft.refmap.json"

minecraft {
    mappings channel: 'parchment', version: '2023.06.26-1.20.1'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        client {
            properties 'mixin.env.remapRefMap': 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            workingDirectory project.file('run')
            arg "-mixin.config=ncat_minecraft.mixins.json"
            property 'forge.logging.console.level', 'debug'

            mods {
                ncat_minecraft {
                    source sourceSets.main
                }
            }
        }

        server {
            properties 'mixin.env.remapRefMap': 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            workingDirectory project.file('run')
            arg "-mixin.config=ncat_minecraft.mixins.json"


            property 'forge.logging.console.level', 'debug'

            mods {
                ncat_minecraft {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            properties 'mixin.env.remapRefMap': 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'ncat_minecraft', '--all', '--output', file('src/generated/resources/'), '--existing', sourceSets.main.resources.srcDirs[0]
            mods {
                ncat_minecraft {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories{
    mavenCentral()
    maven {
        name = "cursemaven"
        url = "https://www.cursemaven.com"
    }
    maven { url 'https://mcef-download.cinemamod.com/repositories/releases/' }
}

dependencies {
    minecraft 'net.neoforged:forge:1.20.1-47.1.65'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("curse.maven:spark-361579:4381167")
    compileOnly fg.deobf("curse.maven:vivecraft-667903:4794431")

    implementation fg.deobf("com.cinemamod:mcef-forge:2.1.1-1.20.1") {
        transitive = false
    }
    implementation 'com.github.mwiede:jsch:2.28.7'
    jarJar('com.github.mwiede:jsch:[2.28.7]')
    implementation 'io.netty:netty-codec-http:4.1.82.Final'
    jarJar('io.netty:netty-codec-http:[4.1.82.Final]')
}

tasks.named('jarJar') {
    archiveClassifier = ''
    from('LICENSE') {
        into 'META-INF'
    }
    from('NOTICE.md') {
        into 'META-INF'
    }
}

jar {
    archiveClassifier = 'slim'
    from('LICENSE') {
        into 'META-INF'
    }
    from('NOTICE.md') {
        into 'META-INF'
    }
    manifest {
        attributes([
                "Specification-Title": "NCAT Minecraft",
                "Specification-Vendor": "Netcat Test",
                "Specification-Version": "1",
                "Implementation-Title": "NCAT Minecraft",
                "Implementation-Version": project.version,
                "Implementation-Vendor": "Netcat Test",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "ncat_minecraft.mixins.json"
        ])
    }
}
