<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCAT SFTP</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color-scheme:dark}*{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1016;color:#eff5fa}
    body{display:flex;flex-direction:column}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #426579;border-radius:4px;background:#143649;color:#f2fbff;padding:6px 10px}
    button:hover:not(:disabled){background:#1e5671}button:disabled{opacity:.4;cursor:default}button.danger{border-color:#a94750;background:#692832}
    header{display:flex;gap:8px;align-items:center;justify-content:space-between;min-height:42px;padding:6px 10px;border-top:4px solid #19a9bc;border-bottom:1px solid #3b4958;background:#121c27}
    header strong{font-size:14px;letter-spacing:.1em;white-space:nowrap}.status{font-size:11px;color:#9db6c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    nav{display:flex;gap:5px;align-items:center;padding:6px;border-bottom:1px solid #344451;background:#14212d;min-height:38px}nav .path{flex:1;min-width:0;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-family:monospace;font-size:12px}
    .toolbar{display:flex;gap:4px;flex-wrap:wrap;padding:5px;border-bottom:1px solid #344451;background:#101b25}.toolbar button{font-size:10px;padding:4px 6px}
    main{display:grid;grid-template-columns:minmax(145px,40%) minmax(0,1fr);min-height:0;flex:1}.files{overflow:auto;border-right:1px solid #344451}.files button{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:5px;width:100%;border:0;border-radius:0;border-bottom:1px solid #263644;background:transparent;text-align:left;font-size:12px;padding:7px;color:#dcecf4}.files button:hover,.files button.selected{background:#1d3b4e}.files small{font-size:10px;color:#8eacba}.files .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .editor{display:flex;flex-direction:column;min-width:0;min-height:0}.editor-head{padding:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;border-bottom:1px solid #344451}.editor-head strong{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.editor textarea{flex:1;resize:none;min-height:0;padding:10px;background:#0c131b;color:#d7e9ed;border:0;outline:none;font:12px/1.5 Consolas,monospace;tab-size:4}.editor .hint{padding:5px 8px;font-size:10px;color:#8eacba}
    footer{min-height:22px;padding:4px 8px;border-top:1px solid #344451;color:#b9cbd5;background:#121c27;font-size:11px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
    .overlay{position:absolute;inset:42px 0 22px;display:flex;align-items:center;justify-content:center;padding:10px;background:#071018ec;z-index:5}.overlay[hidden]{display:none}.card{width:min(430px,100%);max-height:100%;overflow:auto;padding:15px;border:1px solid #496574;border-radius:7px;background:#172634;box-shadow:0 14px 45px #0009}.card h1{font-size:17px;margin:0 0 8px}.card p{font-size:12px;line-height:1.4;color:#b6c9d2}.card input{width:100%;margin:8px 0 12px;padding:8px;background:#0e1821;border:1px solid #658095;border-radius:3px;color:#fff}.actions{display:flex;gap:7px;justify-content:flex-end}
    @media(max-width:430px){header{min-height:34px}header strong{font-size:11px}main{grid-template-columns:45% 55%}.toolbar button{font-size:9px}.editor textarea{font-size:10px}}
    @media(max-height:250px){.card{padding:7px}.card p{margin:4px 0}.overlay{inset:34px 0 22px}}
  </style>
</head>
<body>
  <header><strong>NCAT // SFTP</strong><span class="status" id="connection"></span></header>
  <nav><button id="parent" type="button">↑</button><span class="path" id="path">/</span><button id="refresh" type="button" data-i18n="refresh">Atualizar</button></nav>
  <div class="toolbar">
    <button data-action="newFile" data-i18n="newFile">Novo arquivo</button><button data-action="newFolder" data-i18n="newFolder">Nova pasta</button>
    <button data-action="rename" data-i18n="rename">Renomear</button><button data-action="permissions" data-i18n="permissions">Permissões</button>
    <button data-action="remove" class="danger" data-i18n="remove">Excluir</button>
  </div>
  <main><div class="files" id="files"></div><section class="editor"><div class="editor-head"><strong id="editing" data-i18n="chooseFile">Selecione um arquivo</strong><button id="save" type="button" data-i18n="save" disabled>Salvar</button></div><textarea id="content" spellcheck="false" disabled></textarea><span class="hint" data-i18n="limit">Edição de arquivos UTF-8 até 256 KiB.</span></section></main>
  <footer id="feedback"></footer>
  <div class="overlay" id="waiting"><div class="card"><h1 data-i18n="waitingTitle">SFTP aguardando SSH</h1><p id="waitingMessage" data-i18n="waitingLink">Vincule esta tela a uma tela NCAT SSH.</p><div class="actions"><button id="openSftp" hidden data-i18n="open">Abrir SFTP</button></div></div></div>
  <div class="overlay" id="ask" hidden><div class="card"><h1 id="askTitle" data-i18n="askTitle">Abrir explorador SFTP?</h1><p id="askMessage" data-i18n="askMessage">A sessão SSH está conectada. Deseja abrir os arquivos remotos nesta tela?</p><div class="actions"><button id="decline" type="button" data-i18n="notNow">Agora não</button><button id="agree" type="button" data-i18n="connect">Conectar</button></div></div></div>
  <div class="overlay" id="dialog" hidden><form class="card" id="dialogForm"><h1 id="dialogTitle"></h1><p id="dialogMessage"></p><input id="dialogInput" autocomplete="off" spellcheck="false" maxlength="255"><div class="actions"><button id="cancelDialog" type="button" data-i18n="cancel">Cancelar</button><button id="confirmDialog" type="submit" data-i18n="confirm">Confirmar</button></div></form></div>
  <script>
    const I={pt:{refresh:'Atualizar',newFile:'Novo arquivo',newFolder:'Nova pasta',rename:'Renomear',permissions:'Permissões',remove:'Excluir',chooseFile:'Selecione um arquivo',save:'Salvar',limit:'Edição de arquivos UTF-8 até 256 KiB.',waitingTitle:'SFTP aguardando SSH',waitingLink:'Vincule esta tela a uma tela NCAT SSH.',waitingSsh:'Aguardando a conexão da tela SSH vinculada.',open:'Abrir SFTP',askTitle:'Abrir explorador SFTP?',askMessage:'A sessão SSH está conectada. Deseja abrir os arquivos remotos nesta tela?',notNow:'Agora não',connect:'Conectar',cancel:'Cancelar',confirm:'Confirmar',connected:'SFTP conectado',disconnected:'SFTP desconectado',loading:'Carregando...',empty:'Pasta vazia',many:'Mostrando os primeiros 500 itens.',saved:'Arquivo salvo.',created:'Criado com sucesso.',renamed:'Renomeado.',deleted:'Excluído.',permissionsChanged:'Permissões alteradas.',name:'Nome',newMode:'Permissões octais (ex.: 0644)',deleteConfirm:'Confirme a exclusão de',invalidAction:'Ação inválida.',invalidPath:'Caminho inválido.',invalidData:'Dados inválidos.',sshUnavailable:'A conexão SSH foi encerrada.',sftpUnavailable:'Conecte ao SFTP primeiro.',fileTooLarge:'Arquivo acima de 256 KiB.',binaryFile:'Este arquivo não é texto UTF-8.',notRegularFile:'Selecione um arquivo de texto comum.',alreadyExists:'Já existe um arquivo com esse nome.',invalidMode:'Use 3 ou 4 dígitos octais.',fileChanged:'Arquivo alterado por outra sessão. Reabra antes de salvar.',remoteError:'Falha na operação remota. Verifique permissões e conexão.',denied:'Acesso negado.',cannotSave:'Abra um arquivo antes de salvar.',noSelection:'Selecione um arquivo ou pasta.',working:'Executando operação...'},en:{refresh:'Refresh',newFile:'New file',newFolder:'New folder',rename:'Rename',permissions:'Permissions',remove:'Delete',chooseFile:'Select a file',save:'Save',limit:'Edit UTF-8 files up to 256 KiB.',waitingTitle:'SFTP waiting for SSH',waitingLink:'Link this display to an NCAT SSH display.',waitingSsh:'Waiting for the linked SSH display to connect.',open:'Open SFTP',askTitle:'Open SFTP explorer?',askMessage:'The SSH session is connected. Open remote files on this display?',notNow:'Not now',connect:'Connect',cancel:'Cancel',confirm:'Confirm',connected:'SFTP connected',disconnected:'SFTP disconnected',loading:'Loading...',empty:'Empty folder',many:'Showing the first 500 items.',saved:'File saved.',created:'Created successfully.',renamed:'Renamed.',deleted:'Deleted.',permissionsChanged:'Permissions updated.',name:'Name',newMode:'Octal permissions (e.g. 0644)',deleteConfirm:'Confirm deletion of',invalidAction:'Invalid action.',invalidPath:'Invalid path.',invalidData:'Invalid data.',sshUnavailable:'The SSH connection ended.',sftpUnavailable:'Connect to SFTP first.',fileTooLarge:'File exceeds 256 KiB.',binaryFile:'This is not UTF-8 text.',notRegularFile:'Select a regular text file.',alreadyExists:'A file with that name already exists.',invalidMode:'Use 3 or 4 octal digits.',fileChanged:'Another session changed this file. Reopen it before saving.',remoteError:'Remote operation failed. Check permissions and connection.',denied:'Access denied.',cannotSave:'Open a file before saving.',noSelection:'Select a file or folder.',working:'Working...'}};
    I.pt.savedBackup='Arquivo salvo. Cópia anterior mantida em ';I.en.savedBackup='File saved. Previous copy kept at ';
    let lang='pt',cwd='/',selected=null,opened=null,openedMeta=null,ready=false,declined=false,asking=false,dialogDone=null,loading=false;
    const $=id=>document.getElementById(id),t=key=>I[lang][key]||key;
    function translate(){document.documentElement.lang=lang==='pt'?'pt-BR':'en';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));}
    function feedback(value){$('feedback').textContent=t(value);}
    function query(name,data){return new Promise((resolve,reject)=>{if(typeof window.cefQuery!=='function'){reject(new Error('remoteError'));return;}window.cefQuery({request:'NcatMinecraft_'+name+JSON.stringify(data),onSuccess:value=>{try{resolve(JSON.parse(value));}catch{resolve(value);}},onFailure:(code,message)=>reject(new Error(message||'remoteError'))});});}
    async function call(action,data={}){try{return await query('Sftp',{action,...data});}catch(error){feedback(error.message);throw error;}}
    function pathOf(name){return (cwd==='/'?'':cwd)+'/'+name;}
    function parent(path){if(path==='/')return '/';const cut=path.lastIndexOf('/');return cut<=0?'/':path.slice(0,cut);}
    async function show(path){if(!ready)return;loading=true;feedback('loading');try{const answer=await call('list',{path});cwd=answer.path;$('path').textContent=cwd;selected=null;const container=$('files');container.replaceChildren();for(const entry of answer.entries){const button=document.createElement('button');button.type='button';button.title=entry.name;const icon=document.createElement('span');icon.textContent=entry.directory?'▣':entry.link?'↗':'▤';const name=document.createElement('span');name.className='name';name.textContent=entry.name;const meta=document.createElement('small');meta.textContent=entry.mode;button.append(icon,name,meta);button.onclick=()=>{selected=entry;container.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));button.classList.add('selected');};button.ondblclick=()=>{selected=entry;if(entry.directory)show(pathOf(entry.name));else openFile(pathOf(entry.name));};container.append(button);}if(!answer.entries.length)feedback('empty');else if(answer.truncated)feedback('many');else feedback('connected');}catch{}finally{loading=false;}}
    async function openFile(path){feedback('loading');try{const answer=await call('read',{path});opened=answer.path;openedMeta={expectedSize:answer.size,expectedModified:answer.modified};$('editing').textContent=opened;$('content').value=answer.content;$('content').disabled=false;$('save').disabled=false;$('content').focus();feedback('connected');}catch{}}
    async function updateStatus(){if(loading)return;let state;try{state=await query('Sftp',{action:'status'});}catch{return;}const active=!!state.sftpReady;$('connection').textContent=t(active?'connected':'disconnected');if(active){ready=true;declined=false;asking=false;$('waiting').hidden=true;$('ask').hidden=true;return;}if(ready){ready=false;opened=null;selected=null;$('content').disabled=true;$('save').disabled=true;$('content').value='';$('files').replaceChildren();}if(!state.linked){$('waiting').hidden=false;$('ask').hidden=true;$('waitingMessage').textContent=t('waitingLink');$('openSftp').hidden=true;declined=false;return;}if(!state.sshReady){$('waiting').hidden=false;$('ask').hidden=true;$('waitingMessage').textContent=t('waitingSsh');$('openSftp').hidden=true;declined=false;return;}if(declined){$('waiting').hidden=false;$('ask').hidden=true;$('waitingMessage').textContent=t('askMessage');$('openSftp').hidden=false;return;}$('waiting').hidden=true;$('ask').hidden=false;asking=true;}
    async function connect(){feedback('working');try{const answer=await call('connect');ready=true;declined=false;asking=false;$('ask').hidden=true;$('waiting').hidden=true;await show(answer.cwd);}catch{await updateStatus();}}
    function dialog(title,message,value,needsInput=true){$('dialogTitle').textContent=title;$('dialogMessage').textContent=message;$('dialogInput').value=value||'';$('dialogInput').hidden=!needsInput;$('dialog').hidden=false;if(needsInput)$('dialogInput').focus();return new Promise(resolve=>dialogDone=resolve);}
    function closeDialog(value){$('dialog').hidden=true;if(dialogDone){dialogDone(value);dialogDone=null;}}
    async function action(kind){if(!ready)return;if(['rename','permissions','remove'].includes(kind)&&!selected){feedback('noSelection');return;}let name,value;try{if(kind==='newFile'||kind==='newFolder'){name=await dialog(t(kind),t('name'),'');if(!name||name==='.'||name==='..'||name.includes('/')||name.includes('\\'))return;await call(kind==='newFile'?'create':'mkdir',{path:pathOf(name)});feedback('created');}else if(kind==='rename'){name=await dialog(t('rename'),selected.name,selected.name);if(!name||name==='.'||name==='..'||name.includes('/')||name.includes('\\'))return;await call('rename',{path:pathOf(selected.name),target:pathOf(name)});feedback('renamed');}else if(kind==='permissions'){value=await dialog(t('permissions'),t('newMode'),selected.mode);if(!value)return;await call('chmod',{path:pathOf(selected.name),mode:value});feedback('permissionsChanged');}else if(kind==='remove'){value=await dialog(t('remove'),t('deleteConfirm')+' '+selected.name+'?',null,false);if(!value)return;await call('delete',{path:pathOf(selected.name)});feedback('deleted');}await show(cwd);}catch{}}
    $('dialogForm').onsubmit=event=>{event.preventDefault();closeDialog($('dialogInput').hidden?true:$('dialogInput').value.trim());};$('cancelDialog').onclick=()=>closeDialog(null);
    $('agree').onclick=connect;$('decline').onclick=()=>{declined=true;$('ask').hidden=true;updateStatus();};$('openSftp').onclick=()=>{declined=false;updateStatus();};
    $('parent').onclick=()=>show(parent(cwd));$('refresh').onclick=()=>show(cwd);document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>action(button.dataset.action));
    $('save').onclick=async()=>{if(!opened||!openedMeta){feedback('cannotSave');return;}feedback('working');try{const answer=await call('save',{path:opened,content:$('content').value,...openedMeta});openedMeta={expectedSize:answer.size,expectedModified:answer.modified};await show(cwd);$('feedback').textContent=answer.backup?t('savedBackup')+answer.backup:t('saved');}catch{}};
    query('Locale',{}).then(value=>{lang=value==='pt_br'?'pt':'en';translate();updateStatus();}).catch(()=>{translate();updateStatus();});
    setInterval(updateStatus,1300);
  </script>
</body>
</html>
